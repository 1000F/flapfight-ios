name: FlapFight
options:
  bundleIdPrefix: com.100f
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  createIntermediateGroups: true
  xcodeVersion: "26.2"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.100f.flapfight
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.0
    INFOPLIST_FILE: FlapFight/Info.plist
    UILaunchScreen_Generation: YES

targets:
  FlapFight:
    type: application
    platform: iOS
    sources:
      - path: FlapFight
    settings:
      base:
        PRODUCT_NAME: FlapFight
        PRODUCT_BUNDLE_IDENTIFIER: com.100f.flapfight
        DEVELOPMENT_ASSET_PATHS: FlapFight/Resources
    info:
      path: FlapFight/Info.plist
      properties:
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

schemes:
  FlapFight:
    build:
      targets:
        FlapFight: all
    run:
      config: Debug
